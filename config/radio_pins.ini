# GPIO profile template. -1 means unassigned; set pins before radio-enabled builds.
# Existing board uses GPIO 4,5,6,7,8,11,12,14,15,16,17,18,38,39,40.
# Avoid strapping GPIO 0,3,45,46; USB 19,20; flash/PSRAM 26-37.
[cc1101]
sck=-1
mosi=-1
miso=-1
cs=-1
gdo0=-1
gdo2=-1
[nrf24]
sck=-1
mosi=-1
miso=-1
csn=-1
ce=-1
irq=-1
