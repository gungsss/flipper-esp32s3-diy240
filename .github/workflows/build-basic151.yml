name: Build ESP32-S3 native160 1.5.1 compatibility preview
on:
  push:
    branches: [work/esp32s3-basic-151-preview]
    paths:
      - 'patch/**'
      - 'variants/st7735/**'
      - 'scripts/**'
      - 'tests/native160/**'
      - 'tests/basic151/**'
      - 'web/tools/publish_st7735_preview.py'
      - 'web/public/flipper-st7735-landscape/index.html'
      - '.github/workflows/build-basic151.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v5.4.1
    env:
      ESP_IDF_EXPORT_SCRIPT: /opt/esp/idf/export.sh
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch clean pinned ESP32 source
        run: bash scripts/fetch_upstream.sh
      - name: Apply display and independent compatibility changes
        run: |
          set -euo pipefail
          python3 patch/patch_flipper.py .work/upstream
          python3 variants/st7735/patch_st7735.py .work/upstream
          python3 variants/st7735/patch_landscape.py .work/upstream
          test ! -e .work/upstream/applications/main/nfc/plugins/supported_cards/hotels.c
          if grep -Eiq 'nfc|hotel' patch/esp32_basic_151.patch; then
            echo 'Unexpected radio or card material in compatibility patch' >&2
            exit 1
          fi
          git -C .work/upstream apply --unidiff-zero --check "$GITHUB_WORKSPACE/patch/esp32_basic_151.patch"
          git -C .work/upstream apply --unidiff-zero "$GITHUB_WORKSPACE/patch/esp32_basic_151.patch"
      - name: Integrate native 160x128 UI and verify render logic
        run: |
          python3 scripts/apply_native160.py .work/upstream
          bash tests/native160/run_host_tests.sh .work/upstream
      - name: Test compatibility changes
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 tests/basic151/check_loader_cli.py .work/upstream
          python3 tests/basic151/check_loader_app_runtime.py .work/upstream
          python3 tests/basic151/check_loader_app_resolution.py .work/upstream
          python3 tests/basic151/check_loader_dialogs.py .work/upstream
          python3 tests/basic151/check_rpc_start.py .work/upstream
          python3 tests/basic151/check_rpc_desktop.py .work/upstream
          python3 tests/basic151/check_core_api.py .work/upstream
          python3 tests/basic151/check_bit_buffer_varint.py .work/upstream
          python3 tests/basic151/check_js_timer.py .work/upstream
          python3 tests/basic151/check_elf_target.py .work/upstream
          python3 tests/basic151/check_browser_callback.py .work/upstream
          python3 tests/basic151/check_date_time_input.py .work/upstream
          python3 tests/basic151/check_151_gui_apis.py .work/upstream
          python3 tests/basic151/check_151_storage_events.py .work/upstream
          python3 tests/basic151/check_rpc_storage_backup.py .work/upstream
          python3 tests/basic151/check_tar_safe_names.py .work/upstream
          python3 tests/basic151/check_tar_partial_write.py .work/upstream
          python3 tests/basic151/check_archive_integration.py .work/upstream
          python3 tests/basic151/check_hid_output.py .work/upstream
          python3 tests/basic151/check_151_example.py .work/upstream
          curl -fLsS --retry 3 -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            'https://api.github.com/repos/flipperdevices/flipperzero-firmware/git/trees/520fb70571ea6882103542d60a6444215b12ce31?recursive=1' \
            -o "$RUNNER_TEMP/official151-tree.json"
          python3 scripts/check_official151_core.py .work/upstream --tree-json "$RUNNER_TEMP/official151-tree.json"
          python3 tests/basic151/check_official151_manifest.py .work/upstream
          python3 tests/basic151/check_external_cli.py .work/upstream
          python3 tests/basic151/check_vcp_compat.py .work/upstream
          if command -v node >/dev/null 2>&1; then
            node tests/basic151/check_js_upload.cjs .work/upstream
          else
            echo 'JavaScript SDK upload test skipped: node is unavailable in this image.'
          fi
          gcc -g -O1 -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/basic151/include -I.work/upstream/components/bit_lib \
            tests/basic151/bit_lib_regression.c .work/upstream/components/bit_lib/bit_lib.c \
            -o "$RUNNER_TEMP/bit-lib-regression"
          "$RUNNER_TEMP/bit-lib-regression"
      - name: Compile ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          ./build_diy.sh --build-only
      - name: Save generated SDK configuration for application builds
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-basic151-sdk-config
          path: .work/upstream/build_diy/config/
          if-no-files-found: error
          retention-days: 7
      - name: Build official 1.5.1 example as native ESP32 application
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          export FAP_FW_BUILD_DIR=build_diy
          export FAP_BOARD=lilygo_t_embed_cc1101
          export FAP_BOARD_INCLUDE=board_DIY.h
          bash ./buildFap.sh applications/examples/example_date_time_input
          python3 tools/check_fap_symbols.py \
            components/flipper_application/flipper_application/firmware_api.c \
            build_diy/fap/objects_example_date_time_input.fap/undef_syms.txt
          python3 "$GITHUB_WORKSPACE/tests/basic151/check_native_example.py" \
            build_diy/fap/example_date_time_input.fap
          bash ./buildFap.sh "$GITHUB_WORKSPACE/tests/basic151/sdk_probe"
          python3 tools/check_fap_symbols.py \
            components/flipper_application/flipper_application/firmware_api.c \
            build_diy/fap/objects_generic_sdk_probe.fap/undef_syms.txt
          python3 "$GITHUB_WORKSPACE/tests/basic151/check_sdk_probe.py" \
            build_diy/fap/generic_sdk_probe.fap \
            build_diy/fap/objects_generic_sdk_probe.fap/undef_syms.txt
      - name: Check inputs and package flashable images
        run: |
          python3 scripts/audit_basic_build.py .work/upstream
          python3 scripts/package_basic_build.py .work/upstream dist/esp32-native160-preview
      - name: Prepare Vercel assets from verified build
        run: python3 web/tools/publish_st7735_preview.py --input dist/esp32-native160-preview --output dist/vercel-native160-release --index-html web/public/flipper-st7735-landscape/index.html
      - name: Upload flash-ready firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-st7735-native160-151-preview
          path: dist/esp32-native160-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Vercel production snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vercel-native160-release
          path: dist/vercel-native160-release/
          if-no-files-found: error
          retention-days: 7

  publish-vercel:
    name: Publish successful firmware to Vercel
    needs: build
    if: success() && github.ref == 'refs/heads/work/esp32s3-basic-151-preview'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release snapshot
        uses: actions/download-artifact@v4
        with:
          name: vercel-native160-release
          path: ${{ runner.temp }}/vercel-release
      - name: Checkout Vercel production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: true
      - name: Update production flasher assets
        env:
          RELEASE_DIR: ${{ runner.temp }}/vercel-release
          SITE_DIR: ${{ github.workspace }}/site
        run: |
          set -euo pipefail
          target="$SITE_DIR/web/public/flipper-st7735-landscape"
          test -f "$RELEASE_DIR/manifest.json"
          mkdir -p "$target/firmware"
          cp "$RELEASE_DIR/index.html" "$target/index.html"
          cp "$RELEASE_DIR/manifest.json" "$target/manifest.json"
          cp "$RELEASE_DIR/release.json" "$target/release.json"
          cp "$RELEASE_DIR/build-info.json" "$target/build-info.json"
          cp "$RELEASE_DIR/ESP32S3_ST7735S_Native160_151_Compatibility_Preview_FLASH_READY.zip" "$target/ESP32S3_ST7735S_Native160_151_Compatibility_Preview_FLASH_READY.zip"
          cp "$RELEASE_DIR/firmware/"*.bin "$target/firmware/"
          git -C "$SITE_DIR" add web/public/flipper-st7735-landscape
          if git -C "$SITE_DIR" diff --cached --quiet; then
            echo "Vercel production already has this firmware release."
            exit 0
          fi
          git -C "$SITE_DIR" config user.name "github-actions[bot]"
          git -C "$SITE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE_DIR" commit -m "build(web): publish Flipper 1.5.1 ESP32 firmware by m4145"
          git -C "$SITE_DIR" fetch origin main
          git -C "$SITE_DIR" rebase origin/main
          git -C "$SITE_DIR" push origin HEAD:main
