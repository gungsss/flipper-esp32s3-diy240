name: Build ESP32-S3 basic 1.5.1 compatibility preview
on:
  push:
    branches: [work/esp32s3-basic-151-preview]
    paths:
      - 'patch/esp32_basic_151.patch'
      - 'tests/basic151/**'
      - 'scripts/audit_basic_build.py'
      - 'scripts/package_basic_build.py'
      - '.github/workflows/build-basic151.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v5.4.1
    env:
      ESP_IDF_EXPORT_SCRIPT: /opt/esp/idf/export.sh
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch clean pinned ESP32 source
        run: bash scripts/fetch_upstream.sh
      - name: Apply display and independent compatibility changes
        run: |
          set -euo pipefail
          python3 patch/patch_flipper.py .work/upstream
          python3 variants/st7735/patch_st7735.py .work/upstream
          python3 variants/st7735/patch_landscape.py .work/upstream
          test ! -e .work/upstream/applications/main/nfc/plugins/supported_cards/hotels.c
          if grep -Eiq 'nfc|hotel' patch/esp32_basic_151.patch; then
            echo 'Unexpected radio or card material in compatibility patch' >&2
            exit 1
          fi
          git -C .work/upstream apply --unidiff-zero --check "$GITHUB_WORKSPACE/patch/esp32_basic_151.patch"
          git -C .work/upstream apply --unidiff-zero "$GITHUB_WORKSPACE/patch/esp32_basic_151.patch"
      - name: Test compatibility changes
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 tests/basic151/check_loader_cli.py .work/upstream
          python3 tests/basic151/check_rpc_start.py .work/upstream
          python3 tests/basic151/check_core_api.py .work/upstream
          python3 tests/basic151/check_js_timer.py .work/upstream
          python3 tests/basic151/check_elf_target.py .work/upstream
          python3 tests/basic151/check_browser_callback.py .work/upstream
          python3 tests/basic151/check_date_time_input.py .work/upstream
          python3 tests/basic151/check_hid_output.py .work/upstream
          python3 tests/basic151/check_151_example.py .work/upstream
          python3 tests/basic151/check_external_cli.py .work/upstream
          python3 tests/basic151/check_vcp_compat.py .work/upstream
          if command -v node >/dev/null 2>&1; then
            node tests/basic151/check_js_upload.cjs .work/upstream
          else
            echo 'JavaScript SDK upload test skipped: node is unavailable in this image.'
          fi
          gcc -g -O1 -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/basic151/include -I.work/upstream/components/bit_lib \
            tests/basic151/bit_lib_regression.c .work/upstream/components/bit_lib/bit_lib.c \
            -o "$RUNNER_TEMP/bit-lib-regression"
          "$RUNNER_TEMP/bit-lib-regression"
      - name: Compile ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          ./build_diy.sh --build-only
      - name: Save generated SDK configuration for application builds
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-basic151-sdk-config
          path: .work/upstream/build_diy/config/
          if-no-files-found: error
          retention-days: 7
      - name: Build official 1.5.1 example as native ESP32 application
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          export FAP_FW_BUILD_DIR=build_diy
          export FAP_BOARD=lilygo_t_embed_cc1101
          export FAP_BOARD_INCLUDE=board_DIY.h
          bash ./buildFap.sh applications/examples/example_date_time_input
          python3 tools/check_fap_symbols.py \
            components/flipper_application/flipper_application/firmware_api.c \
            build_diy/fap/objects_example_date_time_input.fap/undef_syms.txt
          python3 "$GITHUB_WORKSPACE/tests/basic151/check_native_example.py" \
            build_diy/fap/example_date_time_input.fap
      - name: Check inputs and package flashable images
        run: |
          python3 scripts/audit_basic_build.py .work/upstream
          python3 scripts/package_basic_build.py .work/upstream dist/esp32-basic-preview
      - name: Upload experimental test bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-st7735-basic-151-preview
          path: dist/esp32-basic-preview/
          if-no-files-found: error
          retention-days: 14
