name: Verify Flipper 1.5.1 ESP32 development port
on:
  push:
    branches: [work/flipper-1.5.1-official-port]
    paths:
      - 'patch/flipper_1_5_1_port.patch'
      - 'tests/compat151/**'
      - 'scripts/audit_official_151.py'
      - '.github/workflows/build-official151-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official151-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the existing DIY board contracts
        run: python3 -m unittest discover -s tests -v
      - name: Prepare the ESP32 adaptation
        run: |
          bash scripts/fetch_upstream.sh
          git -C .work/upstream apply --check "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          git -C .work/upstream apply "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
      - name: Audit against the exact official 1.5.1 source commit
        run: |
          git init "$RUNNER_TEMP/flipper-official"
          git -C "$RUNNER_TEMP/flipper-official" remote add origin https://github.com/flipperdevices/flipperzero-firmware.git
          git -C "$RUNNER_TEMP/flipper-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.5.1:refs/tags/1.5.1
          git -C "$RUNNER_TEMP/flipper-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.4.3:refs/tags/1.4.3
          python3 scripts/audit_official_151.py "$RUNNER_TEMP/flipper-official" .work/upstream --output "$RUNNER_TEMP/source-audit.json"
          python3 tests/compat151/check_official_api_delta.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_time_input.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_gui_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_core_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_storage_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_rpc_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_example.py "$RUNNER_TEMP/flipper-official" .work/upstream
      - name: Verify ABI ordering and released view behavior
        run: |
          python3 tests/compat151/check_firmware_api.py .work/upstream
          python3 tests/compat151/check_view_api.py .work/upstream
          python3 tests/compat151/check_elf_arch.py .work/upstream
          python3 tests/compat151/check_rpc_start.py .work/upstream
      - name: Verify HID descriptors and output report handling
        run: |
          git clone --quiet --depth=1 --branch 0.21.0 https://github.com/hathach/tinyusb.git "$RUNNER_TEMP/tinyusb"
          test "$(git -C "$RUNNER_TEMP/tinyusb" rev-parse HEAD)" = dae3f9a366bfcddbf9dcf1b48d7500286a849539
          python3 tests/compat151/check_usb_descriptors.py .work/upstream "$RUNNER_TEMP/tinyusb"
      - name: Verify bit extraction with sanitizers
        run: |
          gcc -g -O1 -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/compat151/include -I.work/upstream/components/bit_lib \
            tests/compat151/bit_lib_regression.c .work/upstream/components/bit_lib/bit_lib.c \
            -o "$RUNNER_TEMP/bit-lib-regression"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/bit-lib-regression"

  compile:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    container: espressif/idf:v5.4.1
    defaults:
      run:
        shell: bash
    env:
      ESP_IDF_EXPORT_SCRIPT: /opt/esp/idf/export.sh
      ORIENTATION: ${{ matrix.orientation }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply ESP32 and ST7735S adaptations
        run: |
          bash scripts/fetch_upstream.sh
          git -C .work/upstream apply --check "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          git -C .work/upstream apply "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          python3 patch/patch_flipper.py .work/upstream
          python3 variants/st7735/patch_st7735.py .work/upstream
          if [[ "$ORIENTATION" == landscape ]]; then
            python3 variants/st7735/patch_landscape.py .work/upstream
          fi
      - name: Compile ESP32-S3 firmware without publishing it
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          ./build_diy.sh --build-only
      - name: Build official 1.5.1 examples for the DIY Xtensa target
        if: matrix.orientation == 'landscape'
        run: |
          source /opt/esp/idf/export.sh
          git init "$RUNNER_TEMP/fap-official"
          git -C "$RUNNER_TEMP/fap-official" remote add origin https://github.com/flipperdevices/flipperzero-firmware.git
          git -C "$RUNNER_TEMP/fap-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.5.1:refs/tags/1.5.1
          test "$(git -C "$RUNNER_TEMP/fap-official" rev-parse 1.5.1^{commit})" = 9e810dc399e027e48ce07751df72168abbb19065
          mkdir -p "$RUNNER_TEMP/official-fap"
          git -C "$RUNNER_TEMP/fap-official" archive 1.5.1 \
            applications/examples/example_date_time_input \
            applications/examples/example_view_dispatcher \
            applications/examples/example_apps_data | tar -x -C "$RUNNER_TEMP/official-fap"
          cd .work/upstream
          for app in example_date_time_input example_view_dispatcher example_apps_data; do
            FAP_BOARD=DIY ./buildFap.sh "$RUNNER_TEMP/official-fap/applications/examples/$app"
            test -s "build_diy/fap/$app.fap"
            xtensa-esp32s3-elf-readelf -h "build_diy/fap/$app.fap" | grep -E 'Machine:.*Xtensa'
            python3 tools/check_fap_symbols.py components/flipper_application/flipper_application/firmware_api.c \
              "build_diy/fap/objects_$app.fap/undef_syms.txt"
          done
      - name: Package checked ST7735S development firmware
        run: |
          python3 scripts/package_artifacts.py --source .work/upstream --output /tmp/st7735-install
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          out = Path('/tmp/st7735-install')
          build = Path('.work/upstream/build_diy')
          generated = list(build.rglob('ported_apps.cmake'))
          if len(generated) != 1:
              raise SystemExit('Cannot verify the generated application list')
          app_list = generated[0].read_text()
          if any(name in app_list for name in ('esp32_fam_app_nfc', 'plugins/supported_cards/', 'hotels.c')):
              raise SystemExit('Unexpected NFC parser in DIY firmware')
          version = Path('.work/upstream/components/toolbox/version.c').read_text()
          if '.version = "1.4.3"' not in version:
              raise SystemExit('Unexpected firmware version identity; update package description')

          info_path = out / 'BUILD_INFO.json'
          info = json.loads(info_path.read_text())
          expected = {
              'bootloader/bootloader.bin': '0x0',
              'partition_table/partition-table.bin': '0x8000',
              'furi_esp32.bin': '0x10000',
              'ota_data_initial.bin': '0xbf0000',
          }
          observed = {item['file']: item for item in info['images']}
          if set(observed) != set(expected):
              raise SystemExit('Unexpected flash image list')
          parts, intervals = [], []
          for path, offset in expected.items():
              row = observed[path]
              data = (out / path).read_bytes()
              if row['offset'] != offset or row['size_bytes'] != len(data):
                  raise SystemExit(f'Invalid size or offset: {path}')
              if hashlib.sha256(data).hexdigest() != row['sha256']:
                  raise SystemExit(f'Invalid checksum: {path}')
              if path in ('bootloader/bootloader.bin', 'furi_esp32.bin'):
                  if len(data) < 16 or data[0] != 0xe9 or data[12:14] != bytes((9, 0)):
                      raise SystemExit(f'Not an ESP32-S3 image: {path}')
              if path == 'furi_esp32.bin' and len(data) > 0x5f0000:
                  raise SystemExit('Firmware exceeds OTA slot')
              begin = int(offset, 16)
              if begin + len(data) > 16 * 1024 * 1024:
                  raise SystemExit(f'Image exceeds 16 MB flash: {path}')
              parts.append({'path': path, 'offset': begin})
              intervals.append((begin, begin + len(data)))
          intervals.sort()
          if any(end > start for (_, end), (start, _) in zip(intervals, intervals[1:])):
              raise SystemExit('Flash images overlap')

          orientation = os.environ['ORIENTATION']
          sha = os.environ['GITHUB_SHA']
          info.update({
              'lcd': 'ST7735S 160x128 landscape' if orientation == 'landscape' else 'ST7735S 128x160 portrait',
              'orientation': orientation,
              'source_commit': sha,
              'scope': 'Development ESP32 port with selected Flipper 1.5.1 changes; not full 1.5.1 parity.',
              'reported_flipper_version': '1.4.3',
              'hardware_validation': 'This build has not been tested on the physical device.',
          })
          info_path.write_text(json.dumps(info, indent=2) + '\n')
          manifest = {
              'name': f'ESP32-S3 ST7735S development ({orientation})',
              'version': f'1.4.3-base-dev-{sha[:12]}',
              # Offer the erase choice; false would force full-chip erase on a new install.
              'new_install_prompt_erase': True,
              'new_install_improv_wait_time': 0,
              'builds': [{'chipFamily': 'ESP32-S3', 'parts': parts}],
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          # The packaging helper's documents describe another TFT profile.
          for obsolete in ('FLASH.md', 'HARDWARE.md', 'INSTALL_WINDOWS.md'):
              (out / obsolete).unlink(missing_ok=True)
          print(f'Packaged verified {orientation} ST7735S development images from {sha}.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-st7735-development-${{ matrix.orientation }}
          path: /tmp/st7735-install/
          if-no-files-found: error
          retention-days: 7
