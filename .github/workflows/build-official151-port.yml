name: Verify Flipper 1.5.1 ESP32 development port
on:
  push:
    branches: [work/flipper-1.5.1-official-port]
    paths:
      - 'patch/flipper_1_5_1_port.patch'
      - 'tests/compat151/**'
      - 'scripts/audit_official_151.py'
      - '.github/workflows/build-official151-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official151-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the existing DIY board contracts
        run: python3 -m unittest discover -s tests -v
      - name: Prepare the ESP32 adaptation
        run: |
          bash scripts/fetch_upstream.sh
          git -C .work/upstream apply --check "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          git -C .work/upstream apply "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
      - name: Audit against the exact official 1.5.1 source commit
        run: |
          git init "$RUNNER_TEMP/flipper-official"
          git -C "$RUNNER_TEMP/flipper-official" remote add origin https://github.com/flipperdevices/flipperzero-firmware.git
          git -C "$RUNNER_TEMP/flipper-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.5.1:refs/tags/1.5.1
          git -C "$RUNNER_TEMP/flipper-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.4.3:refs/tags/1.4.3
          python3 scripts/audit_official_151.py "$RUNNER_TEMP/flipper-official" .work/upstream --output "$RUNNER_TEMP/source-audit.json"
          python3 tests/compat151/check_official_api_delta.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_time_input.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_gui_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_format_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_bit_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_stream_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_toolbox_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_stream_runtime.py .work/upstream
          python3 tests/compat151/check_ble_target.py .work/upstream
          python3 tests/compat151/check_ota_profile.py .work/upstream
          python3 tests/compat151/check_ota_integration.py .work/upstream
          python3 tests/compat151/check_official_core_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_storage_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_rpc_api.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_crc32.py "$RUNNER_TEMP/flipper-official" .work/upstream
          python3 tests/compat151/check_official_example.py "$RUNNER_TEMP/flipper-official" .work/upstream
      - name: Verify ABI ordering and released view behavior
        run: |
          python3 tests/compat151/check_firmware_api.py .work/upstream
          python3 tests/compat151/check_view_api.py .work/upstream
          python3 tests/compat151/check_elf_arch.py .work/upstream
          python3 tests/compat151/check_rpc_start.py .work/upstream
      - name: Verify HID descriptors and output report handling
        run: |
          git clone --quiet --depth=1 --branch 0.21.0 https://github.com/hathach/tinyusb.git "$RUNNER_TEMP/tinyusb"
          test "$(git -C "$RUNNER_TEMP/tinyusb" rev-parse HEAD)" = dae3f9a366bfcddbf9dcf1b48d7500286a849539
          python3 tests/compat151/check_usb_descriptors.py .work/upstream "$RUNNER_TEMP/tinyusb"
      - name: Verify bit extraction with sanitizers
        run: |
          gcc -g -O1 -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/compat151/include -I.work/upstream/components/bit_lib \
            tests/compat151/bit_lib_regression.c .work/upstream/components/bit_lib/bit_lib.c \
            -o "$RUNNER_TEMP/bit-lib-regression"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/bit-lib-regression"
          gcc -g -O1 -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/compat151/include -I.work/upstream/components \
            tests/compat151/bit_buffer_regression.c .work/upstream/components/toolbox/bit_buffer.c \
            -o "$RUNNER_TEMP/bit-buffer-regression"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/bit-buffer-regression"

  compile:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
    container: espressif/idf:v5.4.1
    defaults:
      run:
        shell: bash
    env:
      ESP_IDF_EXPORT_SCRIPT: /opt/esp/idf/export.sh
      ORIENTATION: ${{ matrix.orientation }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply ESP32 and ST7735S adaptations
        run: |
          bash scripts/fetch_upstream.sh
          git -C .work/upstream apply --check "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          git -C .work/upstream apply "$GITHUB_WORKSPACE/patch/flipper_1_5_1_port.patch"
          python3 patch/patch_flipper.py .work/upstream
          python3 variants/st7735/patch_st7735.py .work/upstream
          if [[ "$ORIENTATION" == landscape ]]; then
            python3 variants/st7735/patch_landscape.py .work/upstream
          fi
      - name: Compile ESP32-S3 firmware without publishing it
        run: |
          source /opt/esp/idf/export.sh
          cd .work/upstream
          ./build_diy.sh --build-only
      - name: Check compiled DIY inputs
        run: |
          python3 tests/compat151/check_diy_build_inputs.py .work/upstream/build_diy/compile_commands.json
          python3 tests/compat151/check_ota_profile_image.py .work/upstream/build_diy/furi_esp32.bin
      - name: Build official 1.5.1 examples for the DIY Xtensa target
        if: matrix.orientation == 'landscape'
        run: |
          source /opt/esp/idf/export.sh
          git init "$RUNNER_TEMP/fap-official"
          git -C "$RUNNER_TEMP/fap-official" remote add origin https://github.com/flipperdevices/flipperzero-firmware.git
          git -C "$RUNNER_TEMP/fap-official" fetch --depth=1 --filter=blob:none origin refs/tags/1.5.1:refs/tags/1.5.1
          test "$(git -C "$RUNNER_TEMP/fap-official" rev-parse 1.5.1^{commit})" = 9e810dc399e027e48ce07751df72168abbb19065
          mkdir -p "$RUNNER_TEMP/official-fap"
          git -C "$RUNNER_TEMP/fap-official" archive 1.5.1 \
            applications/examples/example_date_time_input \
            applications/examples/example_view_dispatcher \
            applications/examples/example_apps_data | tar -x -C "$RUNNER_TEMP/official-fap"
          cd .work/upstream
          for app in example_date_time_input example_view_dispatcher example_apps_data; do
            FAP_BOARD=DIY ./buildFap.sh "$RUNNER_TEMP/official-fap/applications/examples/$app"
            test -s "build_diy/fap/$app.fap"
            xtensa-esp32s3-elf-readelf -h "build_diy/fap/$app.fap" | grep -E 'Machine:.*Xtensa'
            python3 tools/check_fap_symbols.py components/flipper_application/flipper_application/firmware_api.c \
              "build_diy/fap/objects_$app.fap/undef_syms.txt"
          done
          FAP_BOARD=DIY ./buildFap.sh "$GITHUB_WORKSPACE/tests/compat151/sdk_probe"
          test -s build_diy/fap/sdk_151_probe.fap
          xtensa-esp32s3-elf-readelf -h build_diy/fap/sdk_151_probe.fap | grep -E 'Machine:.*Xtensa'
          python3 tools/check_fap_symbols.py components/flipper_application/flipper_application/firmware_api.c \
            build_diy/fap/objects_sdk_151_probe.fap/undef_syms.txt
      - name: Try the existing build in the SPI-capable ESP emulator
        if: matrix.orientation == 'landscape'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          source /opt/esp/idf/export.sh
          curl -fsSL 'https://github.com/espressif/esp-emulator/releases/download/v1.1.0/esp-emu-1.1.0-x86_64-unknown-linux-gnu.tar.gz' -o "$RUNNER_TEMP/esp-emu.tar.gz"
          printf '%s  %s\n' 'bcb940dcf48aa6a1b62dbdc4abc37f05431710f4040d9e2504723a5ea4fd5de9' "$RUNNER_TEMP/esp-emu.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/esp-emu"
          tar -xzf "$RUNNER_TEMP/esp-emu.tar.gz" -C "$RUNNER_TEMP/esp-emu"
          emulator=$(find "$RUNNER_TEMP/esp-emu" -type f -name esp-emu -print -quit)
          test -n "$emulator" && test -x "$emulator"
          "$emulator" --version
          cd .work/upstream/build_diy
          esptool.py --chip esp32s3 merge_bin --fill-flash-size 16MB \
            -o "$RUNNER_TEMP/esp-emu-flash.bin" @flash_project_args
          set +e
          timeout 100s "$emulator" --chip esp32s3 --psram-size 8M \
            --firmware "$RUNNER_TEMP/esp-emu-flash.bin" --elf "$PWD/furi_esp32.elf" \
            --timeout 80s --exit-on 'All services started, entering background' \
            > "$RUNNER_TEMP/esp-emu-boot.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/esp-emu-boot.log"
          if grep -F 'All services started, entering background' "$RUNNER_TEMP/esp-emu-boot.log"; then
            echo 'Emulator reached service startup; physical peripherals remain untested.'
          else
            echo "::warning::ESP emulator did not reach service startup (exit $status)."
            exit 1
          fi
      - name: Try an ESP32-S3 simulated boot
        if: matrix.orientation == 'landscape'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          source /opt/esp/idf/export.sh
          curl -fsSL 'https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20261109/qemu-xtensa-softmmu-esp_develop_9.2.2_20261109-x86_64-linux-gnu.tar.xz' -o "$RUNNER_TEMP/qemu.tar.xz"
          printf '%s  %s\n' 'fbc3bffa9fa71192847969a627a584aabe2e86d85bed4902a096ff06c2b8a815' "$RUNNER_TEMP/qemu.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qemu-new"
          tar -xf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP/qemu-new"
          qemu_bin=$(find "$RUNNER_TEMP/qemu-new" -type f -name qemu-system-xtensa -print -quit)
          test -n "$qemu_bin" && test -x "$qemu_bin"
          "$qemu_bin" --version
          cd .work/upstream/build_diy
          esptool.py --chip esp32s3 merge_bin --fill-flash-size 16MB \
            -o "$RUNNER_TEMP/simulated-flash.bin" @flash_project_args
          # Use a virtual eFuse file for QEMU, never a physical device.
          # S3 ADC self-calibration is not emulated by QEMU.
          espefuse.py --chip esp32s3 --do-not-confirm --virt \
            burn_efuse BLK_VERSION_MAJOR 1 \
            dump --format joint --file_name "$RUNNER_TEMP/qemu-efuse.bin"
          set +e
          timeout 45s "$qemu_bin" -nographic -no-reboot -machine esp32s3 -m 8M \
            -global driver=ssi_psram,property=is_octal,value=true \
            -drive "file=$RUNNER_TEMP/simulated-flash.bin,if=mtd,format=raw" \
            -drive "file=$RUNNER_TEMP/qemu-efuse.bin,if=none,format=raw,id=efuse" \
            -global driver=nvram.esp32s3.efuse,property=drive,value=efuse \
            > "$RUNNER_TEMP/qemu-boot.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/qemu-boot.log"
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then exit "$status"; fi
          grep -F 'All services started, entering background' "$RUNNER_TEMP/qemu-boot.log"
          echo 'Emulated boot reached service startup; real peripherals remain untested.'
      # Development builds are compiled for verification only; no release artifacts are published.
