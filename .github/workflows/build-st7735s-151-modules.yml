name: Build M4145 Flipper 1.5.1 ST7735S radio test firmware

on:
  push:
    branches: [codex/st7735s-151-modules]
    paths:
      - '.github/workflows/build-st7735s-151-modules.yml'
      - 'patch/**'
      - 'variants/st7735/**'
      - 'scripts/build_local.sh'
      - 'scripts/validate_m4145_pinout.py'
      - 'tests/**'
      - 'scripts/audit_st7735_ui.py'
      - 'scripts/fetch_upstream.sh'
      - 'scripts/package_artifacts.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: st7735s-151-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v5.4.1
    defaults:
      run:
        shell: bash
    env:
      ESP_IDF_EXPORT_SCRIPT: /opt/esp/idf/export.sh
    steps:
      - uses: actions/checkout@v4
      - name: Check project contracts
        run: python3 -m unittest discover -s tests -v
      - name: Build 1.5.1 backport for ST7735S landscape
        run: bash scripts/build_local.sh
      - name: Package flash images and profile metadata
        run: |
          python3 scripts/package_artifacts.py \
            --source .work/upstream \
            --output "$RUNNER_TEMP/st7735s-package" \
            --profile-name "m4145-unified"
          python3 - "$RUNNER_TEMP/st7735s-package/BUILD_INFO.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          info = json.loads(Path(sys.argv[1]).read_text())
          if info['lcd'] != 'ST7735S landscape 160x128, CS tied to GND, 5 MHz SPI':
              raise SystemExit(f"Wrong target profile: {info['lcd']}")
          if 'Full-panel 160x128' not in info['ui_rendering']:
              raise SystemExit(f"Display is not configured full-screen: {info['ui_rendering']}")
          if info['official_flipper_tag'] != '1.5.1':
              raise SystemExit('Unexpected Flipper source tag')
          expected_modules = {'CC1101 Sub-GHz', 'nRF24L01+'}
          if set(info['enabled_optional_modules']) != expected_modules:
              raise SystemExit(f"Radio test image has an unexpected module set: {info['enabled_optional_modules']}")
          if info['firmware_author'] != 'm4145':
              raise SystemExit('Firmware author branding is not m4145')
          apps = Path('.work/upstream/fam_config.py').read_text()
          if 'APPS = [app for app in APPS if app not in ("wlan", "ble_spam")]' not in apps:
              raise SystemExit('Active Wi-Fi/BLE disruption apps were not excluded')
          cmake = Path('.work/upstream/CMakeLists.txt').read_text()
          if 'tools/patch_wifi_lib.py' in cmake or 'include(cmake/wifite_sdk_adapter.cmake)' in cmake:
              raise SystemExit('Raw Wi-Fi TX or Wifite SDK adapter remains enabled')
          wifi_component = Path('.work/upstream/components/wifi/CMakeLists.txt').read_text()
          if any(source in wifi_component for source in ('wifite/core.c', 'wifite/pixie.c', 'wifite/radio.c', 'wifite/link.c')):
              raise SystemExit('Wifite/WPS attack sources remain in the firmware image')
          if 'm4145_safe_profile_stubs.c' not in wifi_component:
              raise SystemExit('Safe inert stubs for unused exported API entries are missing')
          stubs = Path('.work/upstream/components/wifi/m4145_safe_profile_stubs.c').read_text()
          if 'WifiteJob* wifite_start' not in stubs or 'bool wlan_hal_evil_portal_is_running' not in stubs:
              raise SystemExit('Required safe profile symbols are not defined')
          streaming = Path('.work/upstream/applications/main/streaming/application.fam').read_text()
          if 'sources=["*.c*"' not in streaming or '../wlan_app/views/wlan_lan_view.c' not in streaming or '../wlan_app/views/wlan_view_common.c' not in streaming:
              raise SystemExit('Safe shared LAN view sources are missing from Streaming')
          print('Packaged', info['build_profile'], 'with modules:', info['enabled_optional_modules'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m4145-flipper-151-st7735s-unified
          path: ${{ runner.temp }}/st7735s-package
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: m4145-flipper-151-st7735s-unified
          path: ${{ runner.temp }}/m4145-st7735s
      - name: Stage the single ST7735S flasher image
        run: |
          set -euo pipefail
          preview='web/public/flipper-st7735-151'
          core="$preview/landscape"
          rm -rf "$core" "$preview/all-modules" "$preview/portrait"
          mkdir -p "$core"
          cp -a "$RUNNER_TEMP/m4145-st7735s/." "$core/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f "$preview"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No preview files changed.'
            exit 0
          fi
          git commit -m 'build: publish ST7735S landscape profile previews'
          git push origin "HEAD:${GITHUB_REF_NAME}"
