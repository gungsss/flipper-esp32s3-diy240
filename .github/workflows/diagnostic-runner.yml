name: Diagnostic - Runner availability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-runner.yml'
permissions:
  contents: read
jobs:
  runner_test:
    name: GitHub-hosted runner smoke test (no checkout)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Print runner identity
        run: |
          echo "GitHub runner allocated successfully"
          uname -a
          python3 --version
